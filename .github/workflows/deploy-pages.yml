name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static web build
        # These two are read from the repo's Settings → Secrets and
        # variables → Actions (see README.md → "Setting up Supabase" for
        # where the values come from and how to add them here). They get
        # baked into the exported JS bundle at this step — that's expected
        # for the anon/public key; see src/lib/supabase.ts for why that's
        # the correct key to use here.
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # This site is served from a /family-portal subpath here, but at
          # the domain root on Hostinger — see app.config.js for why this
          # can't just be a fixed value in app.json.
          PAGES_BASE_PATH: /family-portal

      # GitHub Pages ignores files/folders starting with an underscore by
      # default (its Jekyll processing step) — Expo's web output puts the
      # actual JS bundle under `_expo/`, so this file disables that.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
